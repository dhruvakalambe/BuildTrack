
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks | BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">BuildTrack</a>
    <div>
        <a class="btn btn-outline-light btn-sm me-2" th:href="@{/}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm me-2" th:href="@{/projects}">Projects</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/tasks}">Tasks</a>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Task Management</h2>
            <p class="text-secondary mb-0">Manage construction work and deadlines.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/tasks/new}">+ New Task</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Task</th>
                    <th>Project</th>
                    <th>Assignee</th>
                    <th>Priority</th>
                    <th>Deadline</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td>
                        <strong th:text="${task.title}"></strong>
                        <div class="small text-secondary"
                             th:text="${task.description}"></div>
                    </td>
                    <td th:text="${task.project.name}"></td>
                    <td th:text="${task.assignee}"></td>
                    <td th:text="${task.priority}"></td>
                    <td th:text="${task.deadline}"></td>
                    <td>
                        <span class="badge text-bg-secondary"
                              th:text="${task.status}"></span>
                    </td>
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a>
                        <form th:action="@{/tasks/{id}/delete(id=${task.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Delete this task?')">
                            <button class="btn btn-sm btn-outline-danger"
                                    type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="7" class="text-center py-5">
                        <h5>No tasks yet</h5>
                        <p class="text-secondary">Create your first construction task.</p>
                        <a class="btn btn-primary" th:href="@{/tasks/new}">
                            Create Task
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
