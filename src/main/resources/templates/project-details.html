
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Details | BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6fa; color:#172033; }
        .panel { background:white; border:1px solid #e7eaf0; border-radius:14px; }
        .label { color:#64748b; font-size:.85rem; }
        .value { font-weight:600; }
        .btn-build { background:#f5a623; border:0; font-weight:600; }
    </style>
</head>
<body>
<div class="container py-5">
    <a th:href="@{/projects}" class="text-decoration-none text-secondary">← Back to projects</a>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 my-4">
        <div>
            <div class="text-secondary small">PROJECT DETAILS</div>
            <h2 class="fw-bold" th:text="${project.name}">Project name</h2>
            <span class="badge text-bg-light" th:text="${project.status}">Planned</span>
        </div>
        <a class="btn btn-build"
           th:href="@{/projects/{id}/edit(id=${project.id})}">Edit Project</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="panel p-4">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="label">Location</div>
                <div class="value" th:text="${project.location}">Location</div>
            </div>
            <div class="col-md-6">
                <div class="label">Budget</div>
                <div class="value" th:text="${'₹' + #numbers.formatDecimal(project.budget, 1, 2)}">₹0.00</div>
            </div>
            <div class="col-md-6">
                <div class="label">Start date</div>
                <div class="value" th:text="${project.startDate}">Start</div>
            </div>
            <div class="col-md-6">
                <div class="label">Deadline</div>
                <div class="value" th:text="${project.deadline}">Deadline</div>
            </div>
            <div class="col-12">
                <div class="label">Description</div>
                <p class="mb-0" th:text="${project.description ?: 'No description provided.'}">Description</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
