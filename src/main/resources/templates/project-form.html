
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | BuildTrack'">Project Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6fa; color:#172033; }
        .form-panel { max-width:850px; margin:auto; background:white; border:1px solid #e7eaf0; border-radius:16px; padding:28px; }
        .btn-build { background:#f5a623; border:0; font-weight:600; }
    </style>
</head>
<body>
<div class="container py-5">
    <a th:href="@{/projects}" class="text-decoration-none text-secondary">← Back to projects</a>

    <div class="form-panel mt-3">
        <h3 class="fw-bold" th:text="${pageTitle}">Create Project</h3>
        <p class="text-secondary">Enter the construction project details below.</p>

        <form th:object="${project}"
              th:action="${project.id == null} ? @{/projects} : @{/projects/{id}/edit(id=${project.id})}"
              method="post">

            <div class="mb-3">
                <label class="form-label">Project name *</label>
                <input type="text" class="form-control" th:field="*{name}" required maxlength="150">
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Location *</label>
                <input type="text" class="form-control" th:field="*{location}" required maxlength="150">
                <div class="text-danger small" th:errors="*{location}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                <div class="text-danger small" th:errors="*{description}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Budget (₹) *</label>
                <input type="number" class="form-control" th:field="*{budget}" min="0" step="0.01" required>
                <div class="text-danger small" th:errors="*{budget}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Start date *</label>
                    <input type="date" class="form-control" th:field="*{startDate}" required>
                    <div class="text-danger small" th:errors="*{startDate}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Deadline *</label>
                    <input type="date" class="form-control" th:field="*{deadline}" required>
                    <div class="text-danger small" th:errors="*{deadline}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Status *</label>
                <select class="form-select" th:field="*{status}">
                    <option value="Planned">Planned</option>
                    <option value="In Progress">In Progress</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Completed">Completed</option>
                </select>
                <div class="text-danger small" th:errors="*{status}"></div>
            </div>

            <button class="btn btn-build px-4" type="submit">Save Project</button>
            <a th:href="@{/projects}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
