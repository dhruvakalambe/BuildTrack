
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Materials | BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Materials Inventory</h2>
            <p class="text-muted mb-0">Track construction materials and stock shortages.</p>
        </div>
        <div>
            <a href="/" class="btn btn-outline-secondary me-2">Dashboard</a>
            <a href="/materials/new" class="btn btn-primary">+ Add Material</a>
        </div>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Material</th>
                        <th>Project</th>
                        <th>In Stock</th>
                        <th>Required</th>
                        <th>Supplier</th>
                        <th>Stock Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="material : ${materials}">
                        <td class="fw-semibold" th:text="${material.name}"></td>

                        <td th:text="${material.project != null ? material.project.name : 'N/A'}"></td>

                        <td>
                            <span th:text="${material.quantityInStock}"></span>
                            <span th:text="${material.unit}"></span>
                        </td>

                        <td>
                            <span th:text="${material.quantityRequired}"></span>
                            <span th:text="${material.unit}"></span>
                        </td>

                        <td th:text="${material.supplier != null && !material.supplier.isBlank()
                                      ? material.supplier : '—'}"></td>

                        <td>
                            <span th:if="${material.quantityInStock != null
                                         && material.quantityRequired != null
                                         && material.quantityInStock.compareTo(material.quantityRequired) < 0}"
                                  class="badge bg-danger">Shortage</span>

                            <span th:unless="${material.quantityInStock != null
                                             && material.quantityRequired != null
                                             && material.quantityInStock.compareTo(material.quantityRequired) < 0}"
                                  class="badge bg-success">Sufficient</span>
                        </td>

                        <td>
                            <a th:href="@{/materials/{id}/edit(id=${material.id})}"
                               class="btn btn-sm btn-outline-primary">Edit</a>

                            <form th:action="@{/materials/{id}/delete(id=${material.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this material?');">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(materials)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No materials added yet. Click "Add Material" to get started.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
