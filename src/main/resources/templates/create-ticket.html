
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Ticket | HelpDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">HelpDesk</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">
            Back to Dashboard
        </a>
    </div>
</nav>

<main class="container py-5" style="max-width: 760px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h2 class="mb-2">Create Support Ticket</h2>
            <p class="text-secondary mb-4">
                Describe the issue so the support team can help.
            </p>

            <form th:action="@{/tickets}" method="post"
                  th:object="${ticket}">

                <div class="mb-3">
                    <label class="form-label" for="title">Ticket Title</label>
                    <input class="form-control" id="title" type="text"
                           th:field="*{title}"
                           placeholder="e.g. Laptop won't start" required>
                    <div class="text-danger small"
                         th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="requesterName">
                        Your Name
                    </label>
                    <input class="form-control" id="requesterName"
                           type="text" th:field="*{requesterName}"
                           placeholder="Enter your name" required>
                    <div class="text-danger small"
                         th:errors="*{requesterName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="description">
                        Problem Description
                    </label>
                    <textarea class="form-control" id="description"
                              th:field="*{description}" rows="5"
                              placeholder="Explain what happened..."
                              required></textarea>
                    <div class="text-danger small"
                         th:errors="*{description}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="category">
                            Category
                        </label>
                        <select class="form-select" id="category"
                                th:field="*{category}">
                            <option value="Hardware">Hardware</option>
                            <option value="Software">Software</option>
                            <option value="Network">Network</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="priority">
                            Priority
                        </label>
                        <select class="form-select" id="priority"
                                th:field="*{priority}">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">
                        Submit Ticket
                    </button>
                    <a th:href="@{/}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
