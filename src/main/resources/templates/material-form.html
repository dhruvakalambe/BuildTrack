
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | BuildTrack'">Material Form | BuildTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="mb-4">
                <a href="/materials" class="text-decoration-none">&larr; Back to Materials</a>
                <h2 class="fw-bold mt-3" th:text="${pageTitle}">Add Material</h2>
                <p class="text-muted">Enter the material inventory details below.</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <form th:object="${material}"
                          th:action="${material.id == null} ? @{/materials} : @{/materials/{id}/edit(id=${material.id})}"
                          method="post">

                        <div class="mb-3">
                            <label for="name" class="form-label">Material Name *</label>
                            <input type="text" id="name" th:field="*{name}"
                                   class="form-control"
                                   placeholder="e.g. Cement, Steel, Sand" required>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="projectId" class="form-label">Project *</label>
                            <select id="projectId" name="projectId"
                                    class="form-select" required>
                                <option value="">Select a project</option>
                                <option th:each="project : ${projects}"
                                        th:value="${project.id}"
                                        th:text="${project.name}"
                                        th:selected="${material.project != null and material.project.id == project.id}">
                                </option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="quantityInStock" class="form-label">Quantity in Stock *</label>
                                <input type="number" id="quantityInStock"
                                       th:field="*{quantityInStock}"
                                       class="form-control" min="0" step="0.01"
                                       required>
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('quantityInStock')}"
                                     th:errors="*{quantityInStock}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="quantityRequired" class="form-label">Quantity Required *</label>
                                <input type="number" id="quantityRequired"
                                       th:field="*{quantityRequired}"
                                       class="form-control" min="0" step="0.01"
                                       required>
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('quantityRequired')}"
                                     th:errors="*{quantityRequired}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="unit" class="form-label">Unit *</label>
                            <select id="unit" th:field="*{unit}"
                                    class="form-select" required>
                                <option value="">Select unit</option>
                                <option value="bags">Bags</option>
                                <option value="kg">Kilograms (kg)</option>
                                <option value="tonnes">Tonnes</option>
                                <option value="cubic metres">Cubic metres (m³)</option>
                                <option value="pieces">Pieces</option>
                                <option value="litres">Litres</option>
                                <option value="metres">Metres</option>
                            </select>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('unit')}"
                                 th:errors="*{unit}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="supplier" class="form-label">Supplier</label>
                            <input type="text" id="supplier" th:field="*{supplier}"
                                   class="form-control"
                                   placeholder="Enter supplier name">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/materials" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4"
                                    th:text="${material.id == null} ? 'Add Material' : 'Save Changes'">
                                Save Material
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
