
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket Details | HelpDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">HelpDesk</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">
            Dashboard
        </a>
    </div>
</nav>

<main class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="text-secondary mb-1">
                Ticket #<span th:text="${ticket.id}"></span>
            </p>
            <h2 class="mb-0" th:text="${ticket.title}">Ticket title</h2>
        </div>
        <span class="badge fs-6"
              th:text="${ticket.status}"
              th:classappend="${ticket.status == 'Resolved'} ? ' text-bg-success' :
                              (${ticket.status == 'In Progress'} ? ' text-bg-warning' : ' text-bg-primary')">
            Open
        </span>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <h5 class="mb-3">Issue Description</h5>
            <p class="text-secondary" style="white-space: pre-wrap;"
               th:text="${ticket.description}">
                Description goes here.
            </p>

            <hr>

            <div class="row g-4">
                <div class="col-md-6">
                    <small class="text-secondary">Requester</small>
                    <div class="fw-semibold"
                         th:text="${ticket.requesterName}"></div>
                </div>

                <div class="col-md-6">
                    <small class="text-secondary">Category</small>
                    <div class="fw-semibold"
                         th:text="${ticket.category}"></div>
                </div>

                <div class="col-md-6">
                    <small class="text-secondary">Priority</small>
                    <div class="fw-semibold"
                         th:text="${ticket.priority}"></div>
                </div>

                <div class="col-md-6">
                    <small class="text-secondary">Created At</small>
                    <div class="fw-semibold"
                         th:text="${#temporals.format(ticket.createdAt, 'dd MMM yyyy, hh:mm a')}">
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-4">

        <h5 class="mb-3">Manage Ticket</h5>

        <div th:if="${successMessage}"
             class="alert alert-success"
             th:text="${successMessage}">
        </div>

        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/tickets/{id}/status(id=${ticket.id})}"
              method="post"
              class="row g-3 align-items-end">

            <div class="col-md-8">
                <label for="status" class="form-label">Update Status</label>

                <select id="status" name="status" class="form-select">
                    <option value="Open"
                            th:selected="${ticket.status == 'Open'}">
                        Open
                    </option>
                    <option value="In Progress"
                            th:selected="${ticket.status == 'In Progress'}">
                        In Progress
                    </option>
                    <option value="Resolved"
                            th:selected="${ticket.status == 'Resolved'}">
                        Resolved
                    </option>
                </select>
            </div>

            <div class="col-md-4">
                <button type="submit" class="btn btn-primary w-100">
                    Update Status
                </button>
            </div>
        </form>
    </div>

    <a th:href="@{/}" class="btn btn-outline-secondary">
        Back to Dashboard
    </a>
</main>

</body>
</html>
