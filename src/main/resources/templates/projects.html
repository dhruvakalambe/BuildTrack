
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects | BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6fa; color:#172033; }
        .panel { background:white; border:1px solid #e7eaf0; border-radius:14px; }
        .btn-build { background:#f5a623; border:0; font-weight:600; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <a th:href="@{/}" class="text-decoration-none text-secondary">← Dashboard</a>
            <h2 class="fw-bold mt-2 mb-1">Projects</h2>
            <p class="text-secondary mb-0">Manage your construction portfolio.</p>
        </div>
        <a class="btn btn-build" th:href="@{/projects/new}">+ New Project</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="panel p-3 p-md-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Project</th>
                    <th>Location</th>
                    <th>Budget</th>
                    <th>Deadline</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="project : ${projects}">
                    <td class="fw-semibold" th:text="${project.name}">Project</td>
                    <td th:text="${project.location}">Location</td>
                    <td th:text="${'₹' + #numbers.formatDecimal(project.budget, 1, 2)}">₹0.00</td>
                    <td th:text="${project.deadline}">Date</td>
                    <td><span class="badge text-bg-light" th:text="${project.status}">Planned</span></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-dark"
                               th:href="@{/projects/{id}(id=${project.id})}">Open</a>
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/projects/{id}/edit(id=${project.id})}">Edit</a>
                            <form th:action="@{/projects/{id}/delete(id=${project.id})}"
                                  method="post"
                                  onsubmit="return confirm('Delete this project?')">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(projects)}">
                    <td colspan="6" class="text-center py-5">
                        <h5>No projects yet</h5>
                        <p class="text-secondary">Create your first project to get started.</p>
                        <a th:href="@{/projects/new}" class="btn btn-build">Create Project</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
