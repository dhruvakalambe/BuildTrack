
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Issues | BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">BuildTrack</a>
    <div>
        <a class="btn btn-outline-light btn-sm me-2" th:href="@{/projects}">Projects</a>
        <a class="btn btn-outline-light btn-sm me-2" th:href="@{/tasks}">Tasks</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/issues}">Site Issues</a>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Site Issues</h2>
            <p class="text-secondary mb-0">Report and track construction-site problems.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/issues/new}">+ Report Issue</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Issue</th>
                    <th>Project</th>
                    <th>Severity</th>
                    <th>Reported By</th>
                    <th>Reported At</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="issue : ${issues}">
                    <td>
                        <strong th:text="${issue.title}"></strong>
                        <div class="small text-secondary"
                             th:text="${issue.description}"></div>
                    </td>
                    <td th:text="${issue.project.name}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${issue.severity == 'Critical'} ? ' text-bg-danger' : (${issue.severity == 'High'} ? ' text-bg-warning' : ' text-bg-secondary')"
                              th:text="${issue.severity}"></span>
                    </td>
                    <td th:text="${issue.reportedBy}"></td>
                    <td th:text="${issue.reportedAt}"></td>
                    <td th:text="${issue.status}"></td>
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/issues/{id}/edit(id=${issue.id})}">Edit</a>
                        <form th:action="@{/issues/{id}/delete(id=${issue.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Delete this issue?')">
                            <button class="btn btn-sm btn-outline-danger"
                                    type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(issues)}">
                    <td colspan="7" class="text-center py-5">
                        <h5>No site issues reported</h5>
                        <p class="text-secondary">Report an issue to get started.</p>
                        <a class="btn btn-primary" th:href="@{/issues/new}">
                            Report Issue
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
