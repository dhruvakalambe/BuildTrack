
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Form | BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">BuildTrack</a>
    <a class="btn btn-outline-light btn-sm" th:href="@{/tasks}">Back to Tasks</a>
</nav>

<main class="container py-4" style="max-width: 800px">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 th:text="${pageTitle}">Create Task</h2>
            <p class="text-secondary">Enter the task details below.</p>

            <form th:object="${task}"
                  th:action="${task.id == null} ? @{/tasks} : @{/tasks/{id}/edit(id=${task.id})}"
                  method="post">

                <div th:if="${#fields.hasAnyErrors()}"
                     class="alert alert-danger">
                    Please correct the errors below before saving.
                </div>

                <div class="mb-3">
                    <label class="form-label">Task title *</label>
                    <input class="form-control" th:field="*{title}" required>
                    <div class="text-danger small" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Construction project *</label>
                    <select class="form-select" name="projectId" required>
                        <option value="">Select a project</option>
                        <option th:each="project : ${projects}"
                                th:value="${project.id}"
                                th:text="${project.name}"
                                th:selected="${task.project != null and task.project.id != null and task.project.id == project.id}">
                        </option>
                    </select>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('project')}"
                         th:errors="*{project}"></div>
                </div>


                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Assigned to *</label>
                    <input class="form-control" th:field="*{assignee}" required>
                    <div class="text-danger small" th:errors="*{assignee}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Priority</label>
                        <select class="form-select" th:field="*{priority}">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="To Do">To Do</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Deadline *</label>
                    <input type="date" class="form-control"
                           th:field="*{deadline}" required>
                    <div class="text-danger small" th:errors="*{deadline}"></div>
                </div>

                <button type="submit" class="btn btn-primary">Save Task</button>
                <a th:href="@{/tasks}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</main>
</body>
</html>
